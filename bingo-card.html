<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ビンゴカード（穴あけ式）</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root{
    --bg-navy:#15132f;
    --bg-navy-deep:#0a0920;
    --paper:#faf3e3;
    --paper-shadow:#d9cba0;
    --hole:#0a0920;
    --gold:#f5c451;
    --cream:#faf3e3;
    --col-b:#2f6fed;
    --col-i:#f2994a;
    --col-n:#27ae60;
    --col-g:#eb5757;
    --col-o:#9b51e0;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:radial-gradient(ellipse at 50% -10%, #2c2760 0%, var(--bg-navy) 40%, var(--bg-navy-deep) 85%);
    color:var(--cream);
    font-family:'Zen Kaku Gothic New', sans-serif;
    overflow-x:hidden;
  }
  .bg-confetti{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:
      radial-gradient(circle, var(--col-b) 2px, transparent 2.5px),
      radial-gradient(circle, var(--col-i) 2px, transparent 2.5px),
      radial-gradient(circle, var(--col-g) 2px, transparent 2.5px),
      radial-gradient(circle, var(--gold) 2px, transparent 2.5px);
    background-size:140px 140px, 160px 160px, 120px 120px, 180px 180px;
    background-position:0 0, 40px 60px, 90px 20px, 60px 100px;
  }
  .stage{ position:relative; z-index:1; max-width:520px; margin:0 auto; padding:24px 14px 60px; display:flex; flex-direction:column; align-items:center;}

  h1.title{
    font-family:'Fredoka', sans-serif; font-weight:700;
    font-size:clamp(26px,7vw,36px); letter-spacing:.02em; text-align:center; margin:0 0 4px;
    background:linear-gradient(90deg, var(--col-b), var(--col-i), var(--col-n), var(--col-g), var(--col-o));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 14px rgba(245,196,81,.25);
  }
  .subtitle{ font-size:14px; font-weight:700; letter-spacing:.25em; color:#c9c2ea; margin-bottom:18px; }

  .size-select{ display:flex; align-items:center; gap:12px; margin-bottom:16px; background:rgba(255,255,255,.06); padding:10px 16px; border-radius:16px; }
  .size-label{ font-size:16px; font-weight:700; color:#e2ddf7; }
  .size-btn{
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px;
    width:52px; height:52px; border-radius:12px; border:none; cursor:pointer;
    background:transparent; color:#e2ddf7;
  }
  .size-btn.active{ background:var(--gold); color:#3a2a06; box-shadow:0 3px 8px rgba(0,0,0,.35); }
  .size-btn:disabled{ opacity:.35; cursor:not-allowed; }

  .cards-controls{ display:flex; gap:10px; margin-bottom:6px; }
  .erase-btn{
    font-family:'Fredoka', sans-serif; font-weight:700; font-size:18px;
    background:var(--gold); color:#3a2a06; border:none; border-radius:14px;
    padding:13px 26px; cursor:pointer; box-shadow:0 4px 0 #b98a1f;
  }
  .erase-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #b98a1f; }
  .erase-btn:disabled{ opacity:.35; cursor:not-allowed; filter:grayscale(.4); box-shadow:0 4px 0 #666; }

  .empty-state{
    font-size:16px; font-weight:700; color:#c9c2ea; text-align:center; margin-top:20px;
    border:2px dashed rgba(255,255,255,.15); border-radius:14px; padding:34px 22px;
    max-width:300px; line-height:1.7;
  }

  .hint{ font-size:14px; font-weight:700; color:#b6adde; margin:8px 0 16px; text-align:center; max-width:380px; line-height:1.7; }

  .banner-zone{ height:34px; }
  .banner{
    font-family:'Fredoka', sans-serif; font-weight:700; font-size:24px; color:var(--gold);
    text-shadow:0 0 14px rgba(245,196,81,.6); opacity:0; letter-spacing:.05em;
  }
  .banner.show{ animation:bannerPop 2.2s ease forwards; }
  .banner.reach{ color:#ff7a45; text-shadow:0 0 14px rgba(255,122,69,.65); }
  @keyframes bannerPop{
    0%{ opacity:0; transform:translateY(6px) scale(.85);}
    15%{ opacity:1; transform:translateY(0) scale(1.05);}
    25%{ transform:scale(1);}
    80%{ opacity:1;}
    100%{ opacity:0;}
  }

  .cards-grid{ display:flex; flex-direction:column; gap:26px; width:100%; align-items:center; }

  .bingo-card{
    position:relative; width:100%; max-width:390px;
    background:linear-gradient(180deg, var(--paper), #f0e4c4);
    border-radius:16px; padding:16px 12px 18px;
    box-shadow:0 10px 24px rgba(0,0,0,.4), inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .card-topbar{ display:flex; justify-content:center; align-items:center; margin-bottom:10px; padding:0 4px;}
  .card-status{ font-size:16px; font-weight:800; color:#8a6a2a; font-family:'Fredoka',sans-serif; }
  .card-status.lit{ color:#c0392b; }
  .card-status.reach-status{ color:#e0632b; animation:reachTextPulse 1s ease-in-out infinite; }
  @keyframes reachTextPulse{ 0%,100%{ opacity:1;} 50%{ opacity:.55;} }
  .card-header, .card-grid{ display:grid; gap:6px; }
  .card-header div{
    text-align:center; font-family:'Fredoka',sans-serif; font-weight:700; font-size:26px;
    color:#fff; border-radius:8px; padding:6px 0;
  }
  .cell{
    position:relative; aspect-ratio:1/1; border-radius:10px;
    background:rgba(0,0,0,.035);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  .cell .num{ font-family:'Fredoka',sans-serif; font-weight:700; font-size:clamp(20px,6.4vw,30px); color:#3d2f14; position:relative; z-index:1; transition:opacity .15s; }
  .cell .guide{ position:absolute; width:72%; height:72%; border-radius:50%; border:3px dashed var(--paper-shadow); transition:all .18s ease; }
  .cell.punched .num{ opacity:0; }
  .cell.punched .guide{
    border:none;
    background:radial-gradient(circle at 38% 34%, rgba(255,255,255,.12), transparent 55%), var(--hole);
    box-shadow:inset 0 3px 6px rgba(0,0,0,.65), inset 0 -2px 3px rgba(255,255,255,.08), 0 1px 0 rgba(255,255,255,.35);
    animation:punchIn .25s ease;
  }
  @keyframes punchIn{ 0%{ transform:scale(.3);} 70%{ transform:scale(1.15);} 100%{ transform:scale(1);} }
  .cell.free .guide{ background:var(--gold); border:none; box-shadow:inset 0 2px 4px rgba(0,0,0,.25); }
  .cell.free .star{ position:relative; z-index:1; font-size:26px; color:#fff; }

  .cell.reach .guide{ border-color:#ff5a3c; border-width:3px; }
  .cell.reach .num{ color:#c0392b; }
  .cell.reach{ animation:reachCellPulse 1s ease-in-out infinite; }
  @keyframes reachCellPulse{
    0%,100%{ box-shadow:0 0 0 3px rgba(255,90,60,.35); transform:scale(1); }
    50%{ box-shadow:0 0 0 9px rgba(255,90,60,.15); transform:scale(1.04); }
  }

  #confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:70; }
  .confetti-piece{ position:absolute; width:8px; height:12px; opacity:1; animation:confettiFall 1.6s ease-in forwards; }
  @keyframes confettiFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:var(--end) rotate(720deg); opacity:0; }
  }
</style>
</head>
<body>

<div class="bg-confetti"></div>

<div class="stage">
  <h1 class="title">ビンゴカード</h1>
  <div class="subtitle">PAPERLESS PUNCH CARD</div>

  <div class="size-select">
    <span class="size-label">列数</span>
    <button class="size-btn" data-size="3">3</button>
    <button class="size-btn" data-size="4">4</button>
    <button class="size-btn" data-size="5">5</button>
  </div>

  <div class="cards-controls">
    <button class="erase-btn" id="eraseBtn" disabled>カードを消去</button>
  </div>
  <div class="hint">列数を選ぶとカードが作成されます。抽選機で呼ばれた番号をタップすると、本当に穴が開いたような見た目になります（紙不要）。縦・横・斜めが揃うとビンゴ！</div>

  <div class="banner-zone"><div class="banner" id="banner"></div></div>

  <div class="cards-grid" id="cardsGrid">
    <div class="empty-state" id="emptyState">カードがありません<br>上の列数ボタンを押してください</div>
  </div>
</div>

<div id="confetti-layer"></div>

<script>
(function(){
  "use strict";

  const ALL_LETTERS = ['B','I','N','G','O'];
  const COLORS = { B:'#2f6fed', I:'#f2994a', N:'#27ae60', G:'#eb5757', O:'#9b51e0' };
  const PER_COL = 15;

  let SIZE = 4;
  let LETTERS = ALL_LETTERS.slice(0, SIZE);

  // ---------------- Audio ----------------
  let actx=null;
  function ctx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function tone(freq, start, dur, type='sine', gain=0.16){
    const ac = ctx();
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type=type; osc.frequency.value=freq;
    osc.connect(g); g.connect(ac.destination);
    const t0 = ac.currentTime+start;
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(gain,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function playPunch(){ tone(220,0,0.08,'square',0.12); }
  function playCheer(){ [523.25,659.25,784,1046.5,1318.5].forEach((f,i)=> tone(f,i*0.1,0.35,'triangle',0.17)); }
  function playReach(){ tone(660,0,0.14,'sine',0.16); tone(880,0.1,0.22,'sine',0.16); }

  const confettiLayer = document.getElementById('confetti-layer');
  const confettiColors = [COLORS.B,COLORS.I,COLORS.N,COLORS.G,COLORS.O,'#f5c451'];
  function burstConfetti(x,y,count){
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className='confetti-piece';
      el.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      el.style.left = x+'px'; el.style.top = y+'px';
      const angle = Math.random()*Math.PI*2;
      const dist = 80+Math.random()*180;
      const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist + 60;
      el.style.setProperty('--end', `translate(${dx}px, ${dy}px)`);
      el.style.animationDelay = (Math.random()*0.15)+'s';
      confettiLayer.appendChild(el);
      setTimeout(()=>el.remove(), 1900);
    }
  }

  function showBanner(text, variant){
    const bannerEl = document.getElementById('banner');
    bannerEl.classList.remove('show','reach');
    void bannerEl.offsetWidth;
    bannerEl.textContent = text;
    if(variant==='reach') bannerEl.classList.add('reach');
    bannerEl.classList.add('show');
  }

  const cardsGrid = document.getElementById('cardsGrid');
  const eraseBtn = document.getElementById('eraseBtn');
  const emptyState = document.getElementById('emptyState');
  let card = null;
  let cardCounter = 0;

  function pickUnique(min,max,count){
    const arr = [];
    while(arr.length<count){
      const v = min+Math.floor(Math.random()*(max-min+1));
      if(!arr.includes(v)) arr.push(v);
    }
    return arr;
  }

  // Center free space only when SIZE is odd (has a true center cell)
  function centerInfo(){
    if(SIZE % 2 === 1){
      const c = (SIZE-1)/2;
      return { hasFree:true, row:c, col:c };
    }
    return { hasFree:false, row:-1, col:-1 };
  }

  function createCardData(){
    cardCounter++;
    const free = centerInfo();
    const cols = {};
    LETTERS.forEach((L,ci)=>{
      const min = ci*PER_COL+1, max = ci*PER_COL+PER_COL;
      const isFreeCol = free.hasFree && ci===free.col;
      const count = isFreeCol ? SIZE-1 : SIZE;
      cols[L] = pickUnique(min,max,count);
    });
    const grid = [];
    for(let row=0; row<SIZE; row++){
      const r = [];
      for(let col=0; col<SIZE; col++){
        const L = LETTERS[col];
        if(free.hasFree && row===free.row && col===free.col){
          r.push({num:null, free:true});
        } else {
          const arr = cols[L];
          const isFreeCol = free.hasFree && col===free.col;
          const val = (isFreeCol && row>free.row) ? arr[row-1] : arr[row];
          r.push({num:val, free:false});
        }
      }
      grid.push(r);
    }
    const punched = new Set();
    if(free.hasFree) punched.add(free.row*SIZE+free.col);
    return { id:cardCounter, size:SIZE, grid, punched, completedLines:new Set(), reachLines:new Set(), reachTargets:new Set() };
  }

  function lineDefs(size){
    const lines = [];
    for(let r=0;r<size;r++) lines.push({key:'row'+r, idx:Array.from({length:size},(_,c)=>r*size+c)});
    for(let c=0;c<size;c++) lines.push({key:'col'+c, idx:Array.from({length:size},(_,r)=>r*size+c)});
    lines.push({key:'diag0', idx:Array.from({length:size},(_,i)=>i*size+i)});
    lines.push({key:'diag1', idx:Array.from({length:size},(_,i)=>i*size+(size-1-i))});
    return lines;
  }

  function checkLines(card){
    const lines = lineDefs(card.size);
    const newlyCompleted = [];
    const currentComplete = new Set();
    lines.forEach(line=>{
      const complete = line.idx.every(i=>card.punched.has(i));
      if(complete){
        currentComplete.add(line.key);
        if(!card.completedLines.has(line.key)) newlyCompleted.push(line.key);
      }
    });
    card.completedLines = currentComplete;
    return newlyCompleted;
  }

  function checkReach(card){
    const lines = lineDefs(card.size);
    const currentReach = new Set();
    const targets = new Set();
    lines.forEach(line=>{
      if(card.completedLines.has(line.key)) return; // already bingo, not "reach"
      const punchedCount = line.idx.filter(i=>card.punched.has(i)).length;
      if(punchedCount === card.size-1){
        const missing = line.idx.find(i=>!card.punched.has(i));
        if(missing!==undefined){
          currentReach.add(line.key);
          targets.add(missing);
        }
      }
    });
    const newlyReach = [...currentReach].filter(k=>!card.reachLines.has(k));
    card.reachLines = currentReach;
    card.reachTargets = targets;
    return newlyReach;
  }

  function renderCard(card){
    let cardEl = document.getElementById('card-'+card.id);
    if(!cardEl){
      cardEl = document.createElement('div');
      cardEl.className = 'bingo-card';
      cardEl.id = 'card-'+card.id;
      cardsGrid.appendChild(cardEl);
    }
    cardEl.innerHTML = '';

    const topbar = document.createElement('div');
    topbar.className = 'card-topbar';
    const status = document.createElement('div');
    const isBingo = card.completedLines.size>0;
    const isReach = !isBingo && card.reachLines.size>0;
    status.className = 'card-status' + (isBingo ? ' lit' : isReach ? ' reach-status' : '');
    status.textContent = isBingo ? `🎉 BINGO ×${card.completedLines.size}`
      : isReach ? `🔥 リーチ！ あと1つ`
      : `${card.size}×${card.size} カード`;
    topbar.appendChild(status);
    cardEl.appendChild(topbar);

    const cardLetters = ALL_LETTERS.slice(0, card.size);
    const header = document.createElement('div');
    header.className = 'card-header';
    header.style.gridTemplateColumns = `repeat(${card.size},1fr)`;
    cardLetters.forEach(L=>{
      const d = document.createElement('div');
      d.textContent = L; d.style.background = COLORS[L];
      header.appendChild(d);
    });
    cardEl.appendChild(header);

    const gridEl = document.createElement('div');
    gridEl.className = 'card-grid';
    gridEl.style.gridTemplateColumns = `repeat(${card.size},1fr)`;
    card.grid.forEach((row,r)=>{
      row.forEach((cellData,c)=>{
        const idx = r*card.size+c;
        const cell = document.createElement('div');
        cell.className = 'cell';
        if(cellData.free){
          cell.classList.add('free','punched');
          cell.innerHTML = '<div class="guide"><span class="star">★</span></div>';
        } else {
          const punched = card.punched.has(idx);
          if(punched) cell.classList.add('punched');
          if(!punched && card.reachTargets.has(idx)) cell.classList.add('reach');
          cell.innerHTML = `<span class="num">${cellData.num}</span><div class="guide"></div>`;
          cell.addEventListener('click', ()=>{
            if(card.punched.has(idx)){
              card.punched.delete(idx);
            } else {
              card.punched.add(idx);
              playPunch();
            }
            const newlyCompleted = checkLines(card);
            const newlyReach = checkReach(card);
            renderCard(card);
            if(newlyCompleted.length>0){
              playCheer();
              const rect = cardEl.getBoundingClientRect();
              burstConfetti(rect.left+rect.width/2, rect.top+30, 30);
              showBanner(newlyCompleted.length>1 ? `ビンゴ！ ${newlyCompleted.length}ライン同時達成！` : 'ビンゴ！！', 'gold');
            } else if(newlyReach.length>0){
              playReach();
              showBanner('リーチ！ あと1つでビンゴ', 'reach');
            }
          });
        }
        gridEl.appendChild(cell);
      });
    });
    cardEl.appendChild(gridEl);
  }

  function updateControlsState(){
    const hasCard = !!card;
    document.querySelectorAll('.size-btn').forEach(b=>{
      b.disabled = hasCard;
      b.classList.toggle('active', hasCard && Number(b.dataset.size)===SIZE);
    });
    eraseBtn.disabled = !hasCard;
    emptyState.style.display = hasCard ? 'none' : 'block';
  }

  function generateCard(size){
    if(card) return; // must erase first
    SIZE = size;
    LETTERS = ALL_LETTERS.slice(0, SIZE);
    card = createCardData();
    renderCard(card);
    updateControlsState();
  }

  function eraseCard(){
    if(!card) return;
    const el = document.getElementById('card-'+card.id);
    if(el) el.remove();
    card = null;
    updateControlsState();
  }

  document.querySelectorAll('.size-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> generateCard(Number(btn.dataset.size)));
  });
  eraseBtn.addEventListener('click', eraseCard);

  // start empty
  updateControlsState();
})();
</script>
</body>
</html>
